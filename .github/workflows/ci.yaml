name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions: {}

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 .

  lint-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-docker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: echo "$PIP_CONFIG" > secrets/pip.conf
        env:
          PIP_CONFIG: ${{ secrets.PIP_CONFIG }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: ./docker-bake.hcl
          targets: api-ci
      - run: docker history --no-trunc "$IMAGE_NAME:ci"
      - run: docker save "$IMAGE_NAME:ci" -o image.tar
      - name: Dive
        run: |
          docker run --rm -e CI=true -v "$PWD/image.tar:/image.tar:ro" \
            wagoodman/dive@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10 \
            --source docker-archive /image.tar \
            --ci --lowestEfficiency=0.8 --highestUserWastedPercent=disabled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image
          path: image.tar
          retention-days: 1

  sbom:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
      - name: Syft
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            docker-archive:image.tar --source-name "$IMAGE_NAME" \
            -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json

  grype:
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      # Seuil et VEX lus depuis .grype.yaml
      - name: Grype SBOM
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            anchore/grype@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea \
            sbom:sbom.cdx.json

  trivy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
      - run: docker load -i image.tar
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy dependances
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image
      - run: docker load -i image.tar
      - run: docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:local"
      - run: cp .env.example .env
      - run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: curl -fsS http://localhost:5000/health
      - run: curl -fsS http://localhost:5000/dbtest
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -m "not integration"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  release:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-docker, build, grype, trivy, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ fromJSON(steps.bake.outputs.metadata).api['containerimage.digest'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - run: echo "$PIP_CONFIG" > secrets/pip.conf
        env:
          PIP_CONFIG: ${{ secrets.PIP_CONFIG }}
      - id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: api
          push: true
      - run: docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.meta.outputs.version }}"

  sign:
    runs-on: ubuntu-latest
    needs: [sbom, release]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DIGEST: ${{ needs.release.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - run: cosign sign --yes "$IMAGE_NAME@$DIGEST"
      - run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_NAME@$DIGEST"

  verify:
    runs-on: ubuntu-latest
    needs: [release, sign]
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.release.outputs.digest }}
      IDENTITY: https://github.com/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cosign verify "$IMAGE_NAME@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"
      - run: |
          cosign verify-attestation "$IMAGE_NAME@$DIGEST" --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
